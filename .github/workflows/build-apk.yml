name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/hrydgard/ppsspp.git || true
          git fetch --no-recurse-submodules --tags --force upstream || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble APK
        run: chmod +x ./gradlew && ./gradlew assembleNormalOptimized --stacktrace
      - name: Package
        run: |
          mkdir out
          find . -name "*.apk" -not -path "./out/*" -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: ppsspp-apk
          path: out/
